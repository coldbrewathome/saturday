name: Refresh Bay Area Spots

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # The event pipeline uses local-time math (parseIcsDate hard-codes -07:00,
      # inferTimeWindowFromDate calls Date#getHours). Pin the runner to Pacific
      # so tests and validators behave the same as developer machines.
      # (The missing TZ pin is why every scheduled run failed 2026-05-09 →
      # 2026-06-10: tests/eventPipeline.test.mjs bucketed a 14:00 ICS start as
      # "Evening" under UTC. deploy-pages.yml already carried this fix.)
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # requiresBrowserContext sources (famsf and friends) fetch via headless
      # Chromium; runners ship no browser binaries, and a launch failure used
      # to crash the whole ingest. Install the browser, and the ingest is
      # also hardened to degrade such sources instead of dying.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Ingest Bay Area spots (retry on Overpass 5xx)
        run: |
          for attempt in 1 2 3; do
            npm run ingest:bay-area && exit 0
            echo "Overpass attempt ${attempt} failed; retrying in 60s..."
            sleep 60
          done
          exit 1
      - run: npm run ingest:events
      - run: npm run test
      - run: npm run validate:data
      - run: npm run validate:events
      # The daily refresh must deploy the prerendered SEO pages + sitemap too —
      # Google re-checks a changing sitemap daily, and a dated event page that
      # only ships on push/Friday loses its ~13-day ranking runway. Same env
      # as deploy-pages.yml so the deployed apps behave identically.
      - name: Build kids (FamHop)
        run: npm run build
        env:
          VITE_POLLS_API: "https://saturday-polls.santaclararental2016.workers.dev"
          VITE_GOOGLE_CLIENT_ID: "673443526391-r7oj4up03jd13ti57a6fpq6bcdas91p6.apps.googleusercontent.com"
          VITE_DATA_ORIGIN: "https://famhop-data.pages.dev"

      # Indexing API publishing REMOVED 2026-07-22 — the local 9:00 AM PT cron
      # (scripts/local-indexing-cron.sh) is the SINGLE owner of the 200/day quota
      # and of data/indexing-history.json. When this step ran too (3:17 AM PT), it
      # burned the quota first AND committed its history to main, which the local
      # cron never pulled — so the local run re-submitted the same URLs from stale
      # history until it 429'd (2026-07-22: 15 ok / 158 quota failures). Two
      # writers, one quota, one history file. Do not re-add without removing the
      # local cron.

      - name: Commit refreshed data
        run: |
          git add public/data
          # seo-lastmod.json keeps content-hash -> <lastmod> continuity across
          # builds so unchanged pages don't get fresh timestamps every day.
          if [ -f data/seo-lastmod.json ]; then
            git add data/seo-lastmod.json
          fi

          if [ -z "$(git status --porcelain --cached)" ]; then
            echo "No data or indexing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Bay Area data and indexing history"
          # Concurrent local sessions commit to main; rebase + retry so a push
          # that lands mid-run doesn't reject ours.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      # Push the freshly scanned JSON to the standalone famhop-data Pages
      # project so the kids and (future) adults frontends always read the
      # latest tagged dataset without redeploying themselves. Skipped silently
      # if Cloudflare credentials aren't configured on the repo.
      # The secrets context is NOT available in step-level `if:` — using it
      # there made the whole workflow invalid (no scheduled runs since
      # 2026-06-10; every push minted a phantom "workflow file issue" run).
      # Check the token inside the script instead.
      - name: Deploy shared data feed to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare credentials not configured; skipping feed deploy."
            exit 0
          fi
          npm run build:data-site
          npx wrangler pages deploy data-site/dist \
            --project-name=famhop-data \
            --branch=main \
            --commit-dirty=true

      # Daily app deploys: the ingest above rebuilt dist with fresh event
      # pages + a fresh sitemap + a fresh 410/noindex manifest. Deploying
      # them every morning is what gives Google a daily-changing sitemap to
      # re-crawl. Kids before adults — they share dist/ and must stay
      # sequential. Skipped silently when credentials aren't configured.
      - name: Deploy FamHop to Cloudflare Pages (daily refresh)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare credentials not configured; skipping app deploy."
            exit 0
          fi
          npx wrangler pages deploy dist \
            --project-name=saturday-spots \
            --branch=main \
            --commit-dirty=true
      - name: Build adults (Mosey) — daily refresh
        run: npm run build:adults
        env:
          VITE_POLLS_API: "https://saturday-polls.santaclararental2016.workers.dev"
          VITE_GOOGLE_CLIENT_ID: "673443526391-r7oj4up03jd13ti57a6fpq6bcdas91p6.apps.googleusercontent.com"
          VITE_DATA_ORIGIN: "https://famhop-data.pages.dev"
      - name: Deploy Mosey to Cloudflare Pages (daily refresh)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare credentials not configured; skipping Mosey deploy."
            exit 0
          fi
          npx wrangler pages deploy dist \
            --project-name=nighthop \
            --branch=main \
            --commit-dirty=true

      # IndexNow (Bing/DDG/Yandex/Seznam/Naver) — submitted URLs index within
      # hours. Reads the live sitemap, non-fatal. Google ignores IndexNow, but
      # the daily pings keep every Bing-family index current with today's
      # events.
      - name: Submit to IndexNow
        run: |
          node scripts/indexnow-submit.mjs famhop.com
          node scripts/indexnow-submit.mjs trymosey.com
