<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF5EB;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-one-plan", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 10.5);
        tl.fromTo("#el-03-the-plan", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 10.5);
        tl.to("#el-03-the-plan", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.fromTo("#el-04-make-it-mine", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.to("#el-04-make-it-mine", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 21);
        tl.fromTo("#el-05-the-map", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 21);
        tl.to("#el-05-the-map", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.fromTo("#el-06-16-metros", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.to("#el-06-16-metros", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.fromTo("#el-07-every-friday", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.to("#el-07-every-friday", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 35.5);
        tl.fromTo("#el-08-closer", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 35.5);
        tl.to({}, { duration: 40.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
