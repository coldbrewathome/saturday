  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var ID = "04-make-it-mine";
      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      var R = document.querySelector('[data-composition-id="' + ID + '"]');
      if (!R) return;
      var q = function (s) { return R.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(R.querySelectorAll(s)); };

      var DUR = 5;

      /* ONE tempo grid drives every beat — no scattered hand-tuned offsets. */
      var PULSE = 0.26;
      var B = function (n) { return Math.round(PULSE * n * 1000) / 1000; };

      var CREAM = "#FAF5EB", INK = "#1B1916", ORANGE = "#DD6A1A";

      /* press-release-spring */
      var PRESS_DUR = 0.18, RELEASE_DUR = 0.52, PRESS_SCALE = 0.9, BOUNCE = 2.2;
      /* theme-crossfade-morph */
      var MORPH_DUR = 0.34;

      var PICK1 = B(6);                  /* 1.56 — the day-type chip presses     */
      var REL1  = PICK1 + PRESS_DUR;     /* 1.74 — release === the card re-forms */
      var PICK2 = B(11);                 /* 2.86 — the age chip presses          */
      var REL2  = PICK2 + PRESS_DUR;     /* 3.04 — release === the stops re-write*/

      /* ---------- Scene 1 (0.0–1.0) — the slam, then the two columns ---------- */

      tl.fromTo([q("#f04-top"), q("#f04-meta")],
        { opacity: 0 },
        { opacity: 1, duration: 0.32, ease: "power2.out" }, B(0));

      /* kinetic-beat-slam: the single phrase hits on grid beat 0, growing from its
         left edge so the upper-left anchor never drifts. */
      tl.fromTo(q("#f04-head"),
        { scale: 1.38, filter: "blur(10px)", opacity: 0, transformOrigin: "0% 50%" },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.52, ease: "power4.out" }, B(0));

      tl.fromTo(q("#f04-panel"),
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, B(1));

      tl.fromTo(q("#f04-card"),
        { opacity: 0, x: 56, scale: 0.97 },
        { opacity: 1, x: 0, scale: 1, duration: 0.56, ease: "expo.out" }, B(1));

      tl.fromTo(qa("#f04-grp-day .f04-lab, #f04-grp-day .f04-chip"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.055 }, B(2));

      tl.fromTo(qa("#f04-grp-age .f04-lab, #f04-grp-age .f04-chip"),
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.055 }, B(3));

      /* ---------- Scenes 2+3 — the couple: pick and re-form share ONE beat ---------- */

      var chipDay = q("#f04-chip-day");

      /* press: linear compression (input) */
      tl.to(chipDay, { scale: PRESS_SCALE, duration: PRESS_DUR, ease: "power1.in" }, PICK1);
      /* release: spring recovery (output). Adjacency at PICK1+PRESS_DUR gives state continuity. */
      tl.to(chipDay, { scale: 1, duration: RELEASE_DUR, ease: "back.out(" + BOUNCE + ")" }, REL1);
      /* the pick LANDS — accent-orange filled state, an instant snap, no cursor drawn */
      tl.set(chipDay, { backgroundColor: ORANGE, color: INK }, REL1);
      tl.fromTo(q("#f04-ring-day"),
        { scale: 1, opacity: 0.85 },
        { scale: 1.5, opacity: 0, duration: 0.46, ease: "power2.out" }, REL1);

      /* control-target-sync: the bound card answers at the SAME position as the release.
         theme-crossfade-morph does the swap — opacity only, both skins complete and
         pixel-aligned, the shell (the anchor) untouched. */
      tl.to(q("#f04-skin-a"),
        { opacity: 0, duration: MORPH_DUR, ease: "power2.inOut" }, REL1);
      tl.fromTo(q("#f04-skin-b"),
        { opacity: 0 },
        { opacity: 1, duration: MORPH_DUR, ease: "power2.inOut" }, REL1);

      /* the re-formed photo settles with a slow drift once the morph has landed */
      tl.fromTo(q("#f04-photo-b"),
        { scale: 1 },
        { scale: 1.05, duration: DUR - (REL1 + MORPH_DUR), ease: "none" }, REL1 + MORPH_DUR);

      /* ---------- Scene 4 — the age pick, discrete couple ---------- */

      var chipAge = q("#f04-chip-age");
      tl.to(chipAge, { scale: PRESS_SCALE, duration: PRESS_DUR, ease: "power1.in" }, PICK2);
      tl.to(chipAge, { scale: 1, duration: RELEASE_DUR, ease: "back.out(" + BOUNCE + ")" }, REL2);
      tl.fromTo(q("#f04-ring-age"),
        { scale: 1, opacity: 0.85 },
        { scale: 1.5, opacity: 0, duration: 0.46, ease: "power2.out" }, REL2);

      /* ONE threshold array carries BOTH sides — the chip's filled state and the card's
         stop line — so control and target cannot desync. Entry 0 mirrors the loaded DOM.
         discrete-text-sequence: instant state replacement, reverse-searched each frame. */
      var stopsEl = q("#f04-stops-b");
      var STEPS = [
        { t: 0,           bg: CREAM,  fg: INK,   stops: "Emma Prusch Park → Raging Waters → Bill’s Cafe" },
        { t: REL2,        bg: ORANGE, fg: INK,   stops: "Emma Prusch Park → ··· → Bill’s Cafe" },
        { t: REL2 + 0.26, bg: ORANGE, fg: INK,   stops: "Emma Prusch Park → Sky High → Bill’s Cafe" }
      ];
      var stepAt = function (time) {
        for (var i = STEPS.length - 1; i >= 0; i--) { if (time >= STEPS[i].t) return STEPS[i]; }
        return STEPS[0];
      };
      var driver = { t: 0 };
      var lastStep = null;
      tl.to(driver, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var s = stepAt(driver.t);
          if (s === lastStep) return;
          stopsEl.textContent = s.stops;
          gsap.set(chipAge, { backgroundColor: s.bg, color: s.fg });
          lastStep = s;
        }
      }, 0);

      /* the rewritten line lands with a single settle (no repeat/yoyo) */
      tl.to(stopsEl, { scale: 1.05, duration: 0.14, ease: "power2.out", transformOrigin: "0% 50%" }, REL2 + 0.26);
      tl.to(stopsEl, { scale: 1, duration: 0.24, ease: "power2.inOut" }, REL2 + 0.4);

      /* ---------- Scene 5 — the CTA lands under the card, then the frame holds ---------- */
