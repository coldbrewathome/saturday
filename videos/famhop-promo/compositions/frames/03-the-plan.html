      /* ------------------------------------------------------------------

         The layout is absolutely positioned at authored pixel constants, so
         the target offset is exact rather than measured:
             photo panel  96..636 x 170..730  ->  centre (366, 450)

             T = -offset = (594, 90)
         X uses T exactly. Y is held at +41 so that at peak zoom the card

         card renders 79..863 on screen, shadow to 890.

         Headroom: panel renders 756 x 784 at peak = 73% of frame height.
         Scale and counter-translate share position, duration AND ease.
      ------------------------------------------------------------------ */
      var ZOOM_SCALE = 1.4;
      var ZOOM_DUR = 1.1;
      tl.fromTo('#f03-cam-outer', { scale: ZOOM_SCALE }, { scale: 1, duration: ZOOM_DUR, ease: 'power3.inOut' }, 0);

      /* ------------------------------------------------------------------
         Scene 2 (1.1-2.2s) - dynamic-content-sequencing
         Chunk start times are reduced ONCE from content length
         (BASE + chars x SEC_PER_CHAR), never hardcoded per chunk, then used
         as tween positions. Long-tail settle = expo.out over 0.62s.
      ------------------------------------------------------------------ */
      var TITLE_AT = 1.05;
      var BASE_DURATION = 0.16;
      var SEC_PER_CHAR = 0.012;
      var CHUNKS = [
        { id: '#f03-t1', text: 'Palo Alto rainy-day:', y: 40 },
        { id: '#f03-t2', text: 'animals, art', y: 34 },
        { id: '#f03-t3', text: '& ice cream', y: 34 }
      ];
      var cumulative = 0;
      var TITLE_SEQ = CHUNKS.map(function (c) {
        var start = cumulative;
        cumulative += BASE_DURATION + c.text.length * SEC_PER_CHAR;
        return { id: c.id, y: c.y, start: TITLE_AT + start };
      });
      TITLE_SEQ.forEach(function (c) {
        tl.fromTo(c.id, { opacity: 0, y: c.y }, { opacity: 1, y: 0, duration: 0.62, ease: 'expo.out' }, c.start);
      });

         Scene 3 (2.2-4.2s) - waterfall-entry
         Three stops, one per beat. Inside each beat the orange numeral
         (anchor: biggest travel, longest settle) pops a sub-beat ahead of

      ------------------------------------------------------------------ */
      var STOP_BEATS = [2.24, 2.90, 3.56];
      var NUM_LEAD = 0.18;

      });
