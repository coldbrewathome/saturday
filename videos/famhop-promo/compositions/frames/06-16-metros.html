  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["06-16-metros"] = tl;

      var root = document.querySelector('[data-composition-id="06-16-metros"]');
      var F = 1 / 60;

      /* ---- chrome: topbar in immediately, meta footer as the closing whisper ---- */
      tl.fromTo(root.querySelector(".f06-top"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);

      /* ================= Scene 1 (0.0–1.0s) — "NOT JUST ONE CITY." assembles word by word
         dynamic-content-sequencing: per-word dwell computed from content length, reduced ONCE
         into a flat TIMELINE; a single linear driver swaps DOM only on entry transitions. ==== */
      var WORD_ELS = gsap.utils.toArray(root.querySelectorAll(".f06-w"));
      var BASE_DURATION = 0.10;
      var SEC_PER_CHAR = 0.035;
      var HEAD_T0 = 0.03;

      var cumulative = 0;
      var WORD_TIMELINE = WORD_ELS.map(function (el) {
        var dur = BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
        var start = cumulative;
        cumulative += dur;
        return { el: el, start: start, end: cumulative };
      });
      var HEAD_TOTAL = cumulative; /* ≈0.92s */

      function wordIndexAt(time) {
        for (var i = WORD_TIMELINE.length - 1; i >= 0; i--) {
          if (time >= WORD_TIMELINE[i].start) return i;
        }
        return -1;
      }

      var headDriver = { t: 0 };
      var lastWordIndex = -2;

      tl.set(WORD_ELS, { opacity: 0 }, 0);
      tl.to(
        headDriver,
        {
          t: HEAD_TOTAL,
          duration: HEAD_TOTAL,
          ease: "none",
          onUpdate: function () {
            var idx = wordIndexAt(headDriver.t);
            if (idx === lastWordIndex) return; /* transition-only DOM writes */
            lastWordIndex = idx;
            for (var i = 0; i < WORD_TIMELINE.length; i++) {
              WORD_TIMELINE[i].el.style.opacity = i <= idx ? "1" : "0";
            }
          }
        },
        HEAD_T0
      );

      /* ================= Scene 2 (1.0–2.4s) — three ink-bordered cells land left to right
         spring-pop-entrance (scale 0→1, power3.out, no overshoot) + counting-dynamic-scale
         (proxy value + transform scale sharing one position / duration / ease).
         Counts are paced so 1,007 — the biggest figure — is the LAST to finish. ============ */
      var CELLS = gsap.utils.toArray(root.querySelectorAll(".f06-cell"));
      var LABELS = gsap.utils.toArray(root.querySelectorAll(".f06-l"));
      var POP_DUR = 0.55;
      var CELL_AT = [1.0, 1.15, 1.3];
      var Y_RISE = 24;

      CELLS.forEach(function (el, i) {
        tl.fromTo(
          el,
          { scale: 0, opacity: 0, y: Y_RISE },
          { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
          CELL_AT[i]
        );
      });

      /* value, count duration — 16 lands 2.05, 554 lands 2.50, 1,007 lands 2.70 */
      var STATS = [
        { id: "f06-n1", value: 16, dur: 1.05 },
        { id: "f06-n2", value: 1007, dur: 1.55 },
        { id: "f06-n3", value: 554, dur: 1.2 }
      ];
      var START_SCALE = 0.55; /* START_SIZE / END_SIZE */
      var COUNT_EASE = "power3.out";

      STATS.forEach(function (stat, i) {
        var el = root.querySelector("#" + stat.id);
        var state = { value: 0 };
        tl.to(
          state,
          {
            value: stat.value,
            duration: stat.dur,
            ease: COUNT_EASE,
            onUpdate: function () {
              el.textContent = Math.round(state.value).toLocaleString("en-US");
            }
          },
          CELL_AT[i]
        );
        tl.fromTo(
          el,
          { scale: START_SCALE },
          { scale: 1, duration: stat.dur, ease: COUNT_EASE },
          CELL_AT[i]
        );
      });

      /* labels arrive before their count peaks */
      LABELS.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          CELL_AT[i] + 0.25
        );
      });

      /* ================= Scene 3 (2.4–4.2s) — the 16 metro pills populate in reading order
         waterfall-entry: binary opacity via tl.set + y whip on power4.out; travel/duration vary
         by weight (long names heavier), and the gaps SHRINK across the cascade so the last snaps. */
      var PILLS = gsap.utils.toArray(root.querySelectorAll(".f06-m"));
      var mt = 2.4;
      PILLS.forEach(function (el, i) {
        var len = el.textContent.length;
        var y = len >= 12 ? 72 : len >= 8 ? 46 : 36;
        var d = len >= 12 ? 0.18 : len >= 8 ? 0.15 : 0.12;
        tl.set(el, { opacity: 1, y: y }, mt);
        tl.to(el, { y: 0, duration: d, ease: "power4.out" }, mt);
        var overlapFrames = Math.min(5, 0.5 + i * 0.3);
        mt += d - overlapFrames * F;
      });

      /* ================= Scene 4 (4.2–5.0s) — the freshness claim gets marked, then stillness
         css-marker-patterns / scribble mode: a wavy underline draws itself under "THIS WEEK"

      tl.fromTo(
        root.querySelector("#f06-underline"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.52, ease: "power1.inOut" },
        4.18
      );

      tl.fromTo(
        root.querySelector(".f06-meta"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },

      );
