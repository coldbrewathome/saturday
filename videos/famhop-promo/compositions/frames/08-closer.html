  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ONE tempo grid drives every reveal (kinetic-beat-slam). */
      var PULSE = 0.2;
      var BEATS = [PULSE * 2, PULSE * 5, PULSE * 8, PULSE * 11, PULSE * 18]; // 0.4 1.0 1.6 2.2 3.6

      /* Scene 1 (0.0-0.4) — green plate, cream chrome and the berry stamp are already seated. */

      /* Scene 2 (0.4-2.2) — one tagline line per beat, a distinct axis + ease on each hit. */
      tl.fromTo("#f08-l1",
        { scale: 1.42, filter: "blur(12px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.46, ease: "power4.out" }, BEATS[0]);
      tl.fromTo("#f08-l2",
        { x: -300, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, BEATS[1]);
      tl.fromTo("#f08-l3",
        { y: 78, rotation: 4, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, BEATS[2]);

      /* Scene 3 (2.2-3.6) — the wordmark writes itself on, glyph by glyph (svg-path-draw). */
      var DRAW = 0.34, STAGGER = 0.22, FILL = 0.2;
      var glyphs = ["f08-ltr-f", "f08-ltr-a", "f08-ltr-m", "f08-ltr-h", "f08-ltr-p"];
      glyphs.forEach(function (id, i) {
        var el = document.getElementById(id);
        if (!el) return;
        var len = el.getTotalLength() * 1.02; // measured, over-estimated so nothing clips
        el.style.strokeDasharray = String(len);
        var at = BEATS[3] + i * STAGGER;
        tl.fromTo(el,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: DRAW, ease: "power2.out" }, at);
        tl.fromTo(el,
          { fillOpacity: 0 },
          { fillOpacity: 1, duration: FILL, ease: "power1.out" }, at + 0.24);
      });

      /* the pin-o rings out, then fills accent-orange last */
      var pin = document.getElementById("f08-pin");
      if (pin) {
        var plen = pin.getTotalLength() * 1.02;
        pin.style.strokeDasharray = String(plen);
        var pinAt = BEATS[3] + 0.9;
        tl.fromTo(pin,
          { strokeDashoffset: plen },
          { strokeDashoffset: 0, duration: 0.24, ease: "none" }, pinAt);
        tl.fromTo(pin,
          { fillOpacity: 0 },
          { fillOpacity: 1, duration: 0.24, ease: "power1.out" }, pinAt + 0.18);
        tl.to(pin, { strokeOpacity: 0, duration: 0.2, ease: "power1.out" }, pinAt + 0.2);
      }

        { y: 46, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, BEATS[4]);
