  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-one-plan"] = tl;

      /* ===============================================================
         SCENE 1 (0.00–1.00) — THE CRUSH. The signature beat.
         Frame 01 hands the frame over with its wall at opacity 0.62,
         chips at their authored positions and per-depth resting scales
         (1 / 0.97 / 0.94), the yellow hard-shadow seed chip top-left,
         and the payoff type at full strength. All of it is reproduced
         here, so the hard cut is invisible — then the whole frame
         collapses on ONE point: the plan card's centre, (960, 637).

         Four planes, nearest first: the payoff type sweeps out, then
         the wall's three depth layers at three velocities. Each plane
         carries a velocity-blur envelope on its own window and ease
         (motion-blur-streak), and shrinks while shedding opacity as it
         travels (scale-swap-transition).
         =============================================================== */
      var DEPTH_SCALE = { "0": 1, "1": 0.97, "2": 0.94 };
      var LAYER = {
        a: { start: 0.12, dur: 0.54, blur: 22 },   // near / fastest — longest travel
        b: { start: 0.22, dur: 0.58, blur: 14 },   // mid
        c: { start: 0.32, dur: 0.58, blur: 0 }     // far / slowest — shortest travel
      };
      var chips = gsap.utils.toArray(".f02-tabw");

      // Hold frame 01's inherited wall opacity so nothing can re-base it.
      tl.fromTo(".f02-tabs", { opacity: 0.62 }, { opacity: 0.62, duration: 0.01, ease: "none" }, 0);

      // Plane 0 — the payoff type: nearest to camera, so it is swept out
      // first and clears the stage for the wall behind it. Its
      // transform-origin IS the convergence point in local coordinates
      // (864, 67 == 960, 637 on the frame), so a pure scale collapses it
      // exactly onto the spot the chips are heading for, whatever the type
      // measures. A depth move, so the blur is symmetric and rides an
      // unscaled wrapper (screen-space smear, not a shrinking one).
      tl.fromTo(".f02-payoff",
        { scale: 1, opacity: 1 },
        { scale: 0.10, opacity: 0, duration: 0.46, ease: "power2.in" }, 0.08);
      tl.fromTo(".f02-payoffw",
        { filter: "blur(0px)" },
        { filter: "blur(20px)", duration: 0.46, ease: "power1.in" }, 0.08);

      // Planes 1–3 — the wall.
      chips.forEach(function (w) {
        var L = LAYER[w.dataset.ly];
        var s0 = DEPTH_SCALE[w.dataset.depth || "0"];   // frame 01's resting depth scale
        // Anticipation — one breath before the suction, from the inherited scale.
        tl.fromTo(w.firstElementChild,
          { scale: s0 }, { scale: s0 * 1.04, duration: 0.12, ease: "power2.out" }, 0);
        // Travel rides the wrapper so the blur below stays in screen space.
        tl.fromTo(w,
          { x: 0, y: 0 },
          { x: parseFloat(w.dataset.dx), y: parseFloat(w.dataset.dy),
            duration: L.dur, ease: "power2.in" },
          L.start);
        // Shrink + fade ride the chip itself.
        tl.fromTo(w.firstElementChild,
          { scale: s0 * 1.04, opacity: 1 },
          { scale: s0 * 0.32, opacity: 0, duration: L.dur, ease: "power2.in", immediateRender: false },
          L.start);
      });

      // Directional blur: one SVG filter per fast chip, stdDeviation written
      // on that chip's own travel axis. Built here (not in markup) so the
      // primitives can't be case-mangled by a serializer round-trip.
      var NS = "http://www.w3.org/2000/svg";
      var stage = document.querySelector(".f02-tabs");
      var defs = document.createElementNS(NS, "svg");
      defs.setAttribute("aria-hidden", "true");
      defs.style.cssText = "position:absolute;left:0;top:0;width:0;height:0;overflow:hidden";
      stage.appendChild(defs);

      ["a", "b"].forEach(function (k) {
        var group = chips.filter(function (c) { return c.dataset.ly === k && c.dataset.bx; });
        if (!group.length) return;
        var nodes = [], ax = [];
        group.forEach(function (c) {
          var f = document.createElementNS(NS, "filter");
          f.setAttribute("id", "f02-ff-" + c.dataset.i);
          f.setAttribute("x", "-120%");
          f.setAttribute("y", "-200%");
          f.setAttribute("width", "340%");
          f.setAttribute("height", "500%");
          var b = document.createElementNS(NS, "feGaussianBlur");
          b.setAttribute("in", "SourceGraphic");
          b.setAttribute("stdDeviation", "0 0");   // seeded sharp — t=0 must be crisp
          f.appendChild(b);
          defs.appendChild(f);
          c.style.filter = "url(#f02-ff-" + c.dataset.i + ")";
          nodes.push(b);
          ax.push([parseFloat(c.dataset.bx), parseFloat(c.dataset.by)]);
        });
        var p = { v: 0 };
        var write = function () {
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].setAttribute("stdDeviation",
              (p.v * ax[i][0]).toFixed(2) + " " + (p.v * ax[i][1]).toFixed(2));
          }
        };
        write();
        // Same window as the travel; an accelerating departure, so peak blur
        // lands at peak speed, right as the chip dies on the point.
        tl.fromTo(p, { v: 0 },
          { v: LAYER[k].blur, duration: LAYER[k].dur, ease: "power1.in", onUpdate: write },
          LAYER[k].start);
      });

      /* ===============================================================
         SCENE 2 (0.54–2.10) — sixteen become one, one becomes the plan.
         The seed is a single chip-sized surface standing where the wall
         died. card-morph-anchor scales it (uniform scale, never w/h)
         into the card's exact footprint; the seam onto the real card is
         an INVERSE ZOOM-THROUGH — the seed recedes and blurs, hard cut
         at peak blur, the card arrives oversized and retracts into the
         focal plane. That reads as "arriving at".
         =============================================================== */
      var SEED_W = 232, CARD_W = 1100;
      var END_SCALE = CARD_W / SEED_W;             // 4.741 — the seed is aspect-matched
      var CUT = 1.62, PEAK = 18;                   // big surface → 18px, identical both sides

      tl.fromTo(".f02-seed",
        { scale: 0.28, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 0.54);

      tl.fromTo(".f02-seed", { scale: 1 },
        { scale: END_SCALE, duration: 0.54, ease: "power2.inOut", immediateRender: false }, 0.90);
      // Old content clears over the first ~40% of the morph.
      tl.fromTo(".f02-seed-old", { opacity: 1 },
        { opacity: 0, duration: 0.22, ease: "power1.in" }, 0.90);

      // Phase 1 — the seed recedes, blur and opacity ramp to the cut values.
      tl.fromTo(".f02-seed", { scale: END_SCALE },
        { scale: END_SCALE * 0.8, duration: 0.18, ease: "power3.in", immediateRender: false }, 1.44);
      tl.fromTo(".f02-seedw", { filter: "blur(0px)" },
        { filter: "blur(" + PEAK + "px)", duration: 0.18, ease: "power3.in", immediateRender: false }, 1.44);
      tl.fromTo(".f02-seedw", { opacity: 1 },
        { opacity: 0.15, duration: 0.18, ease: "none" }, 1.44);
      // Phase 2 — the hard cut, at matched blur and opacity.
      tl.fromTo(".f02-seedw", { opacity: 0.15 },
        { opacity: 0, duration: 0.02, ease: "none", immediateRender: false }, CUT);

      // The card is held out of sight until the cut, then phase 3: it arrives
      // oversized, as if from just behind the camera, and retracts.
      tl.fromTo(".f02-card", { opacity: 0 }, { opacity: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo(".f02-card",
        { opacity: 0.15, scale: 1.25, filter: "blur(" + PEAK + "px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.48, ease: "expo.out", immediateRender: false },
        CUT);
      // Inner content reads only once the container has settled.
      tl.fromTo(".f02-title", { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 1.90);

      /* ===============================================================
         SCENE 3 (2.16–3.33) — kinetic-beat-slam on ONE tempo grid.
         Every hit reads its time from PULSE; each phrase gets its own
         entrance axis and its own ease.
         =============================================================== */
      var PULSE = 0.27, BASE = 2.16;
      var BEATS = [BASE, BASE + 2 * PULSE, BASE + 3 * PULSE];

      tl.fromTo("#f02-l1",
        { scale: 1.28, opacity: 0, filter: "blur(14px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
        BEATS[0]);
      tl.fromTo("#f02-l2",
        { x: -280, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.40, ease: "expo.out" },
        BEATS[1]);
      // The inverted ink kicker wipes in along its own width.
      tl.fromTo(".f02-kick",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.36, ease: "power3.out" },
        BEATS[2]);

      /* ===============================================================
         SCENE 4 (3.24–4.70) — the wordmark draws itself on, stroke by
         stroke (svg-path-draw on measured getTotalLength), the letters
         fill, and the pin-o takes accent-orange LAST. Then held: no
         drift, no breathing.
         =============================================================== */
      var STROKES = ["#f02-wm-f", "#f02-wm-a", "#f02-wm-m", "#f02-wm-h", "#f02-wm-o", "#f02-wm-p"];
      var DRAW = BASE + 4 * PULSE, SEG = 0.26, STAG = 0.13;

      STROKES.forEach(function (sel, i) {
        var el = document.querySelector(sel);
        var len = el.getTotalLength() * 1.02;      // slight overestimate never clips the end
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        tl.fromTo(sel, { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: i === 4 ? 0.24 : SEG, ease: "power2.out" },
          DRAW + i * STAG);
      });

      ["#f02-wm-f", "#f02-wm-a", "#f02-wm-m", "#f02-wm-h", "#f02-wm-p"].forEach(function (sel, i) {
        tl.fromTo(sel, { fillOpacity: 0 },
          { fillOpacity: 1, duration: 0.24, ease: "power1.out" }, 4.02 + i * 0.035);
      });
      tl.fromTo("#f02-wm-o", { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.30, ease: "power1.out" }, 4.40);
    })();
  </script>
</template>
