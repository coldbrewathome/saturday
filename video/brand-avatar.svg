<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <title>FamHop — YouTube channel avatar (800×800, circle-safe)</title>
  <defs>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A66"/>
      <stop offset="100%" stop-color="#F2553F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed coral (corners get cropped to a circle by YouTube) -->
  <rect width="800" height="800" fill="url(#coral)"/>
  <rect width="800" height="800" fill="url(#glow)"/>

  <!-- hop route: dashed arc + endpoint stops, the bouncing pin at the apex -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round">
    <path d="M 250 470 Q 400 250 550 470" stroke-width="11" stroke-dasharray="11 16" opacity="0.92"/>
  </g>
  <circle cx="250" cy="470" r="13" fill="#FFFFFF"/>
  <circle cx="550" cy="470" r="13" fill="#FFFFFF"/>
  <circle cx="400" cy="300" r="42" fill="#FFFFFF"/>
  <circle cx="388" cy="288" r="11" fill="#F2553F" opacity="0.30"/>

  <!-- wordmark -->
  <text x="400" y="600" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="128" font-weight="900" letter-spacing="-6" fill="#FFFFFF">famhop</text>
</svg>
