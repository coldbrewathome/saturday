<svg width="2048" height="1152" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
  <title>FamHop — YouTube channel banner (2048×1152, text inside 1235×338 safe area)</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6EE"/>
      <stop offset="100%" stop-color="#FFE2D2"/>
    </linearGradient>
  </defs>

  <rect width="2048" height="1152" fill="url(#bg)"/>

  <!-- scattered coral confetti dots (full-bleed decoration) -->
  <g fill="#FF6B5B" opacity="0.10">
    <circle cx="150" cy="180" r="11"/>
    <circle cx="300" cy="900" r="9"/>
    <circle cx="120" cy="560" r="7"/>
    <circle cx="1900" cy="200" r="13"/>
    <circle cx="1750" cy="930" r="10"/>
    <circle cx="1950" cy="640" r="8"/>
    <circle cx="500" cy="120" r="7"/>
    <circle cx="1550" cy="130" r="9"/>
  </g>

  <!-- decorative hop route across the full width (shows on desktop / TV) -->
  <path d="M 120 300 Q 360 120 600 300 Q 840 120 1080 300 Q 1320 120 1560 300 Q 1800 120 1928 230"
        stroke="#FF6B5B" stroke-width="5" stroke-dasharray="7 14" stroke-linecap="round" fill="none" opacity="0.45"/>
  <g fill="#FF6B5B" opacity="0.8">
    <circle cx="120" cy="300" r="11"/>
    <circle cx="600" cy="300" r="11"/>
    <circle cx="1080" cy="300" r="11"/>
    <circle cx="1560" cy="300" r="11"/>
  </g>

  <!-- ===== SAFE AREA (centered 1235×338: x 406–1642, y 407–745) ===== -->

  <!-- bouncing pin mark above the wordmark -->
  <circle cx="1024" cy="452" r="27" fill="#FF6B5B"/>
  <circle cx="1016" cy="444" r="7" fill="#FFFFFF" opacity="0.5"/>

  <!-- wordmark -->
  <text x="1024" y="595" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="168" font-weight="900" letter-spacing="-7" fill="#1F2937">famhop</text>

  <!-- tagline -->
  <text x="1024" y="660" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="38" font-weight="500" fill="#6B7280">Plan your weekend with the kids — in seconds.</text>

  <!-- url + reach -->
  <text x="1024" y="722" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="25" font-weight="800" letter-spacing="6" fill="#FF6B5B">FAMHOP.COM&#160;&#160;&#160;·&#160;&#160;&#160;FREE IN 16 U.S. METROS</text>
</svg>
